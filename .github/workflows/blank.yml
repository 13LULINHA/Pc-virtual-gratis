
name: Windows Virtual

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Informacoes do Windows
        shell: pwsh
        run: |
          Get-ComputerInfo |
            Select-Object WindowsProductName,
            WindowsVersion,
            OsArchitecture |
            Format-List

      - name: Verificar ambiente
        shell: pwsh
        run: |
          Write-Host "Ambiente Windows iniciado!"
          Write-Host "Versao:"
          Get-ComputerInfo |
            Select-Object WindowsProductName
